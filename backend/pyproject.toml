[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrolens-backend"
version = "1.0.2"
description = "MacroLens API and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "pyjwt[crypto]>=2.10,<3",
  "argon2-cffi>=25,<26",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.40,<2",
  "email-validator>=2.2,<3",
  "lxml>=6,<7",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.26,<2",
  "polars>=1.32,<2",
  "pyarrow>=21,<23",
  "openai>=2.52,<3",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-exporter-otlp>=1.36,<2",
  "sentry-sdk[fastapi]>=2.34,<3",
  "typer>=0.16,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-PyJWT>=1.7,<2",
  "testcontainers[postgres]>=4.12,<5"
]

[project.scripts]
macrolens-api = "macrolens_api.cli:app"
macrolens-worker = "macrolens_worker.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
