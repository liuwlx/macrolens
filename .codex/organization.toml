version = 1
project = "MacroLens"
title_prefix = "ML"
operating_model = "independent_main_threads_with_shared_department_pool"
initial_goal = "local_full_stack_ready"
main_thread_count = 4
department_seat_count = 26
isolation = "git_worktree"
