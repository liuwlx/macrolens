name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: macrolens_test
          POSTGRES_USER: macrolens
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrolens -d macrolens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://macrolens:test-password@127.0.0.1:5432/macrolens_test
      DATABASE_URL_SYNC: postgresql+psycopg://macrolens:test-password@127.0.0.1:5432/macrolens_test
      JWT_SECRET: ci-secret-that-is-at-least-thirty-two-characters
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # Keep CI blocking on correctness-critical lint classes. The broader style profile
      # remains available through `make lint` without turning generated adapters into a
      # release blocker over formatting-only findings.
      - run: ruff check --select E9,F63,F7,F82 backend/src backend/tests
      - run: python -m compileall -q backend/src backend/tests scripts
      - run: PYTHONPATH=backend/src python -m macrolens_worker.main audit-data --structural --output DATA_INGESTION_READINESS.json
      - run: PYTHONPATH=backend/src pytest backend/tests --cov=macrolens_api --cov=macrolens_worker --cov-report=term-missing --cov-fail-under=35
      - run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: PYTHONPATH=backend/src python -m macrolens_api.cli seed
      - run: PYTHONPATH=backend/src python scripts/generate_openapi.py --check
      - run: python scripts/validate_repository.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:sdk
      - run: npm test
      - run: npm run build:sdk
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: macrolens-api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: macrolens-web:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  acceptance:
    runs-on: ubuntu-latest
    needs: [containers]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.env')
          s=p.read_text()
          s=s.replace('POSTGRES_PASSWORD=change-me','POSTGRES_PASSWORD=acceptance-password')
          s=s.replace('macrolens:change-me@postgres','macrolens:acceptance-password@postgres')
          s=s.replace('JWT_SECRET=replace-with-at-least-32-random-characters','JWT_SECRET=acceptance-secret-that-is-at-least-thirty-two-characters')
          s=s.replace('BOOTSTRAP_ADMIN_PASSWORD=change-me-now','BOOTSTRAP_ADMIN_PASSWORD=acceptance-admin-password')
          s=s.replace('S3_SECRET_ACCESS_KEY=change-me-minio','S3_SECRET_ACCESS_KEY=acceptance-minio-password')
          s=s.replace('ENVIRONMENT=development','ENVIRONMENT=test')
          s=s.replace('OPENAI_API_KEY=','OPENAI_API_KEY=acceptance-openai-key')
          s=s.replace('OPENAI_BASE_URL=','OPENAI_BASE_URL=http://mock-openai:8081/v1')
          p.write_text(s)
          PY
      - run: docker compose --profile acceptance up -d --build postgres minio minio-init migrate seed mock-openai
      - run: ./scripts/wait_for_http.sh http://127.0.0.1:8081/health 120
      - run: docker compose run --rm -e ENVIRONMENT=test -e ALLOW_TEST_FIXTURES=true seed python -m macrolens_api.cli seed-test-fixtures
      - run: docker compose --profile acceptance up -d api worker scheduler web
      - run: ./scripts/wait_for_http.sh http://127.0.0.1:8000/api/v1/ready 180
      - run: ./scripts/wait_for_http.sh http://localhost:3000/login 180
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: acceptance-admin-password
      - if: always()
        run: docker compose logs --no-color > docker-compose-acceptance.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: |
            docker-compose-acceptance.log
            apps/web/playwright-report
            apps/web/test-results
