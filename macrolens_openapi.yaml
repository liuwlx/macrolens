          title: Scope
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - name: theme
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Theme
      - name: frequency
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Frequency
      - name: unit
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
      - name: seasonal_adjustment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Seasonal Adjustment
      responses:
