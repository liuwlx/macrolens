            format: uuid
          - type: 'null'
          title: Parent Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: scope
        in: query
        required: false
