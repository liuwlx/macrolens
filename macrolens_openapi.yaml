openapi: 3.1.0
info:
  title: MacroLens API
  description: 宏观数据、发布日历、FOMC、文档检索和 AI 研究平台 API。
  version: 1.0.2
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: Live
      description: Process liveness probe independent from PostgreSQL and external providers.
      operationId: live_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      tags:
      - System
      summary: Ready
      description: Readiness probe that verifies the API can reach its primary database.
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/config:
    get:
